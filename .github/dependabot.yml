version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # tsup's `dts` step goes through rollup-plugin-dts, which uses the
      # TypeScript 5 compiler API internals that TS 7 removed. Revisit when
      # tsup supports TS 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
